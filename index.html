<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 获客文案生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
            padding: 40px 32px;
            max-width: 560px;
            width: 100%;
            margin: 40px auto;
        }
        .btn-primary {
            background: #7c3aed;
            color: white;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 16px;
        }
        .btn-primary:hover {
            background: #6d28d9;
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .input,
        .select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border 0.15s;
            background: white;
        }
        .input:focus,
        .select:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
        }
        .label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 6px;
        }
        .result-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px 18px;
            margin-top: 12px;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.7;
            color: #1f2937;
        }
        .result-card .tag {
            font-weight: 700;
            color: #7c3aed;
            font-size: 13px;
            display: block;
            margin-bottom: 4px;
        }
        .api-row {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .api-row input {
            flex: 1;
            min-width: 180px;
            padding: 8px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .api-row input:focus {
            border-color: #7c3aed;
        }
        .api-row .btn-sm {
            background: #e5e7eb;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.15s;
        }
        .api-row .btn-sm.primary {
            background: #7c3aed;
            color: white;
        }
        .api-row .btn-sm.primary:hover {
            background: #6d28d9;
        }
        .status {
            font-size: 13px;
            color: #10b981;
            font-weight: 500;
            margin-left: 6px;
        }
        .status.missing {
            color: #ef4444;
        }
        .toast {
            font-size: 14px;
            color: #ef4444;
            margin-top: 8px;
            text-align: center;
        }
        .loading {
            text-align: center;
            color: #6b7280;
            padding: 20px 0;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="card">
    <h1 style="font-size:26px; font-weight:700; text-align:center; margin-bottom:4px;">🚀 AI 获客文案生成器</h1>
    <p style="text-align:center; color:#6b7280; margin-bottom:24px; font-size:15px;">输入产品名称，一键生成 3 条获客文案</p >

    <!-- 产品名称 -->
    <label class="label">产品名称</label>
    <input id="productInput" class="input" type="text" placeholder="例如：智能记账 App、有机护肤套装" />

    <!-- 目标平台 -->
    <label class="label" style="margin-top:16px;">目标平台</label>
    <select id="platformSelect" class="select">
        <option value="小红书">📕 小红书</option>
        <option value="抖音">🎵 抖音</option>
        <option value="朋友圈">💬 朋友圈</option>
        <option value="公众号">📰 公众号</option>
    </select>

    <!-- 生成按钮 -->
    <button id="generateBtn" class="btn-primary" style="margin-top:24px;">✨ 生成文案</button>

    <!-- 结果显示区 -->
    <div id="resultArea" style="margin-top:20px;"></div>

    <!-- API Key 配置区 -->
    <div class="api-row">
        <input id="apiKeyInput" type="password" placeholder="粘贴 DeepSeek API Key (sk-...)" />
        <button id="saveApiBtn" class="btn-sm primary">保存</button>
        <span id="apiStatus" class="status missing">未配置</span>
    </div>
    <div id="toastMsg" class="toast"></div>
</div>

<script>
    (function() {
        // DOM 元素
        const productInput = document.getElementById('productInput');
        const platformSelect = document.getElementById('platformSelect');
        const generateBtn = document.getElementById('generateBtn');
        const resultArea = document.getElementById('resultArea');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveApiBtn = document.getElementById('saveApiBtn');
        const apiStatus = document.getElementById('apiStatus');
        const toastMsg = document.getElementById('toastMsg');

        const STORAGE_KEY = 'deepseek_api_key';

        // ----- 初始化：从 localStorage 恢复 Key -----
        function loadApiKey() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved && saved.startsWith('sk-')) {
                apiKeyInput.value = saved;
                apiStatus.textContent = '✅ 已配置';
                apiStatus.className = 'status';
                return saved;
            } else {
                apiStatus.textContent = '❌ 未配置';
                apiStatus.className = 'status missing';
                return null;
            }
        }

        // ----- 保存 API Key -----
        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (!key || !key.startsWith('sk-')) {
                toastMsg.textContent = '⚠️ 请输入有效的 API Key（以 sk- 开头）';
                return;
            }
            localStorage.setItem(STORAGE_KEY, key);
            apiStatus.textContent = '✅ 已配置';
            apiStatus.className = 'status';
            toastMsg.textContent = '✅ API Key 已保存';
            setTimeout(() => { toastMsg.textContent = ''; }, 3000);
        }

        // ----- 生成文案 -----
        async function generate() {
            const product = productInput.value.trim();
            const platform = platformSelect.value;

            // 校验产品名
            if (!product) {
                toastMsg.textContent = '⚠️ 请填写产品名称';
                return;
            }

            // 校验 API Key
            const apiKey = localStorage.getItem(STORAGE_KEY);
            if (!apiKey || !apiKey.startsWith('sk-')) {
                toastMsg.textContent = '⚠️ 请先配置有效的 DeepSeek API Key';
                return;
            }

            // 清空旧结果，显示加载状态
            resultArea.innerHTML = `<div class="loading">⏳ 正在生成文案...</div>`;
            toastMsg.textContent = '';

            // 按钮禁用
            generateBtn.disabled = true;
            generateBtn.textContent = '⏳ 生成中...';

            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: '你是一个资深的内容营销专家。请根据用户提供的产品名称和目标平台，生成3条不同风格的获客文案。每条文案要符合该平台的调性。小红书要加话题标签，朋友圈要口语化，抖音要有悬念和互动感，公众号要有深度和专业感。直接输出结果，不要有多余说明。' },
                            { role: 'user', content: '产品名称：' + product + '，目标平台：' + platform }
                        ],
                        temperature: 0.8,
                        max_tokens: 2000
                    })
                });

                const data = await response.json();

                if (data.choices && data.choices.length > 0) {
                    const text = data.choices[0].message.content;
                    // 按 "1." "2." "3." 分割
                    const parts = text.split(/\d+\.\s*/).filter(p => p.trim().length > 0);
                    let html = '';
                    if (parts.length >= 3) {
                        for (let i = 0; i < 3; i++) {
                            html += `<div class="result-card"><span class="tag">✏️ 风格 ${i+1}</span>${parts[i].trim()}</div>`;
                        }
                    } else {
                        // 如果没按格式分割，整段显示
                        html = `<div class="result-card">${text}</div>`;
                    }
                    resultArea.innerHTML = html;
                    toastMsg.textContent = '✅ 生成完成！';
                    setTimeout(() => { toastMsg.textContent = ''; }, 3000);
                } else {
                    const errMsg = data.error?.message || '未知错误';
                    resultArea.innerHTML = `<div class="result-card" style="color:#dc2626;">❌ 生成失败：${errMsg}</div>`;
                    toastMsg.textContent = '❌ 生成失败，请检查 API Key 或网络';
                }
            } catch (err) {
                resultArea.innerHTML = `<div class="result-card" style="color:#dc2626;">❌ 网络错误：${err.message}</div>`;
                toastMsg.textContent = '❌ 网络请求失败，请检查网络';
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = '✨ 生成文案';
            }
        }

        // ----- 绑定事件 -----
        saveApiBtn.addEventListener('click', saveApiKey);
        generateBtn.addEventListener('click', generate);

        // 回车键快速生成
        productInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') generate();
        });

        // 加载已有 Key
        loadApiKey();
    })();
</script>

</body>
</html>
